name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (lint)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint for real errors (build-breaking)
        run: |
          # E9/F63/F7/F82 are syntax errors, undefined names, and similarly
          # genuine bugs. This is the only check that fails the build —
          # style nits shouldn't block a hackathon submission.
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint for style (non-blocking)
        run: |
          flake8 backend --count --exit-zero --max-line-length=120 --statistics

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
